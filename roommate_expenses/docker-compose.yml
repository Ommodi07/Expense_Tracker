services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roommate_expenses_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped